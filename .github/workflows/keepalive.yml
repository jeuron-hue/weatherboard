name: keep-alive
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          curl -fsS "https://nyjsrnntxdgfykkmihpx.supabase.co/rest/v1/meta?select=id&limit=1" \
            -H "apikey: sb_publishable_q75DGiJBda-NwE3tdgPtFg_g3Rasmcg" \
            -H "Authorization: Bearer sb_publishable_q75DGiJBda-NwE3tdgPtFg_g3Rasmcg"
      - name: Touch stamp
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keep-alive $(cat .keepalive)" || exit 0
          git push
